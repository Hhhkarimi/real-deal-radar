[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-deal-radar"
version = "0.9.0"
description = "Stateful Persian deal hunter with exceptional alerts and verified 12-hour digests"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
dealradar = "dealradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
